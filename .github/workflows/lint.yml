name: Lint
on:
  push:
    branches: [0.0.x]
  pull_request:
    branches: [0.0.x]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check pluginator/ tests/
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check pluginator/ tests/